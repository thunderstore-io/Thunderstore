[tool.poetry]
name = "Thunderstore"
version = "0.0.0"
description = "Thunderstore is a mod database and API for downloading mods"
authors = ["Mythic <mythicmaniac@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
Django = "^4.2"
django-environ = "^0.4"
arrow = "^0.17"
Pillow = "^10.3"
psycopg2-binary = "^2.9.9"
easy-thumbnails = "^2.9"  # This has a monkeypatch and might be a difficult upgrade
gunicorn = { version = "^20.0", extras = ["gevent"] }
gevent = "^24.2"
uwsgi = { version = "2.0.30", markers = "sys_platform != 'win32'" }
# uWSGI is Unix only. Cannot install on Windows.
social-auth-app-django = "^5.4"
social-auth-core = "^4.4"
whitenoise = "^6.2"
django-storages = { version = "^1.14", extras = ["boto3"] }
# Held at 3.14: DRF 3.15 changes client-visible behavior (404 detail
# messages, schema generation) and deserves its own upgrade commit.
djangorestframework = "~3.14"
drf-yasg = "^1.21"
django-ipware = "^3.0"
sentry_sdk = {extras = ["celery"], version = "^1.31.0"}
django-redis = "^5.2"
# django-redis declares no upper bound on redis-py; keep the client on
# the widely-deployed 5.x line rather than whatever resolves newest.
redis = "^5.2"
pyjwt = { version = "^2.0", extras = ["crypto"] }
celery = "^5.5"
django-celery-results = "^2.5"
django-celery-beat = "^2.5"
ulid2 = "^0.2.0"
django-cachalot = "^2.9"
django-cors-headers = "^3.14"
boto3 = "^1.17.47"
bleach = ">=3.3,<7.0"
markdown-it-py = {version = "2.1.0", extras = ["linkify"]}
abyss = {git = "https://github.com/akx/abyss.git", rev = "4352e557f25a303f718ec1bf82ea0ca545ebc077"}
lxml = "^4.9.4"
pygments = "^2.16.1"
confluent-kafka = "2.11.1"
# Only used by historical migrations; Django itself no longer needs pytz.
pytz = "*"

[tool.poetry.group.plugins]
optional = true

[tool.poetry.group.plugins.dependencies]
django-paypal = { path = "../python-packages/django-paypal", develop = true }
paypal-api = { path = "../python-packages/paypal-api", develop = true }
ts-subsys = { path = "../python-packages/ts-subsys", develop = true }
ts-scanners = { path = "../python-packages/ts-scanners", develop = true }
ts-moderation = { path = "../python-packages/ts-moderation", develop = true }

[tool.poetry.dev-dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
pytest-django = "^4.8"
factory_boy = "^3.2"
Faker = "^6.0"
pytest-mock = "^3.5"
django-debug-toolbar = "^4.0"
pytest-env = "^0.6.2"
black = "~22.3.0"  # kept in sync with .pre-commit-config.yaml
isort = "^5.7.0"
jsonschema = "<4.0.0"
pre-commit = "^2.9.3"
mypy = "^1.10"
django-stubs = "^4.2"
djangorestframework-stubs = "^3.14"
watchdog = {extras = ["watchmedo"], version = "^4.0"}
mypy-boto3-s3 = "^1.17.47"
freezegun = "^1.5.5"
pydantic = "^1.10.13"
pytest-xdist = "^3.6"
pytest-split = "^0.8.0"

[tool.black]
# No explicit target-version: black 22.3.0 predates the py312 identifier.
# Auto-detection per file yields the same formatting; set this to py312
# when black is eventually upgraded past 23.x.
exclude = '''
(
  /(
      \.git
    | \.mypy_cache
    | \.venv
    | \.vscode
    | \.idea
  )/
)
'''

[tool.isort]
profile = "black"
known_third_party = ["django"]

[build-system]
requires = ["poetry>=1.4"]
build-backend = "poetry.masonry.api"
