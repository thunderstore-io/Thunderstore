[mypy]
plugins =
    mypy_django_plugin.main,
    mypy_drf_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = "thunderstore.core.settings"

# factory-boy 3.3.3 ships type annotations but leaves its metaclass __call__
# untyped, so mypy would read SomeFactory() as a factory instead of a model.
[mypy-factory.*]
follow_imports = skip
